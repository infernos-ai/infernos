[package]
name = "infernos"
version = "0.1.0"
edition = "2021"
authors = ["Muhammad Hamza <hamza.00dev1@gmail.com>"]
description = "Permissionless Open-Model Inference Paid in Sats via L402"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/infernos-ai/infernos"
keywords = ["lightning", "l402", "inference", "ai", "bitcoin"]
categories = ["cryptography::cryptocurrencies", "web-programming::http-server"]

[lib]
name = "infernos"
path = "src/lib.rs"

[[bin]]
name = "infernos"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
async-trait = "0.1"

# Web / HTTP (Server & Client)
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
http = "1.2"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Cryptography & L402 / Macaroons
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Time & Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
bytes = "1.12.1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.17"
